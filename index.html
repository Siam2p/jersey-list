<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jersey List Maker | Premium Sports Management</title>
    <meta name="description" content="Professional Jersey List Maker for sports teams. Manage sizes, numbers, and pricing with Excel export.">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons (via CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ExcelJS: full Excel styling support (fills, fonts, borders, merges) -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            transition: all 0.3s ease;
        }
        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        
        @media (max-width: 640px) {
            .mobile-grid {
                grid-template-columns: 1fr;
            }
        }
        


    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-card border-b border-slate-800 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i data-lucide="shirt" class="text-white w-6 h-6"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Jersey<span class="gradient-text">Pro</span></h1>
            </div>
            <button id="downloadPdf" class="gradient-btn px-5 py-2.5 rounded-xl font-semibold text-sm flex items-center space-x-2">
                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Export Excel</span>
                <span class="sm:hidden">Excel</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- Input Form Side -->
            <div class="lg:col-span-4">
                <div class="glass-card rounded-2xl p-6 sticky top-28">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <i data-lucide="plus-circle" class="w-5 h-5 mr-2 text-blue-400"></i>
                        Add New Jersey
                    </h2>
                    
                    <form id="jerseyForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Serial No</label>
                                <input type="number" id="serialNo" required placeholder="01" 
                                    class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Jersey No</label>
                                <input type="text" id="jerseyNo" required placeholder="10" 
                                    class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Player Name</label>
                            <input type="text" id="playerName" required placeholder="Enter name" 
                                class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Size</label>
                                <select id="size" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all appearance-none cursor-pointer">
                                    <option value="XS">XS</option>
                                    <option value="S">S</option>
                                    <option value="M" selected>M</option>
                                    <option value="L">L</option>
                                    <option value="XL">XL</option>
                                    <option value="XXL">XXL</option>
                                </select>
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Type</label>
                                <select id="type" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all appearance-none cursor-pointer">
                                    <option value="Half">Half Sleeve</option>
                                    <option value="Full">Full Sleeve</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Length</label>
                                <input type="text" id="lane" placeholder='28"' 
                                    class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Chest Size</label>
                                <input type="text" id="chest" placeholder='40"' 
                                    class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-slate-400 uppercase tracking-wider">Price (Taka)</label>
                            <div class="relative">
                                <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">৳</span>
                                <input type="number" id="price" required placeholder="000" 
                                    class="w-full bg-slate-900/50 border border-slate-700 rounded-xl pl-8 pr-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                            </div>
                        </div>

                        <button type="submit" class="w-full gradient-btn py-3 rounded-xl font-bold mt-4 shadow-lg">
                            Add to List
                        </button>
                    </form>
                </div>
            </div>

            <!-- List Display Side -->
            <div class="lg:col-span-8">
                <div class="flex justify-between items-end mb-6">
                    <div>
                        <h2 class="text-2xl font-bold">Orders Summary</h2>
                        <p class="text-slate-400 text-sm">Total jerseys: <span id="totalCount" class="text-blue-400 font-bold">0</span></p>
                    </div>
                    <button id="clearAll" class="text-slate-500 hover:text-red-400 text-sm font-medium transition-colors flex items-center">
                        <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i>
                        Clear All
                    </button>
                </div>

                <!-- Desktop Table -->
                <div class="hidden md:block glass-card rounded-2xl overflow-hidden">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="border-b border-slate-700 bg-slate-800/50">
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">S/N</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Player</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Size</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">L/C</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Type</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">No.</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Price</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="jerseyTableBody">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                    <div id="emptyState" class="py-20 text-center hidden">
                        <i data-lucide="inbox" class="w-12 h-12 mx-auto text-slate-600 mb-4"></i>
                        <p class="text-slate-500">No jerseys added yet.</p>
                    </div>
                </div>

                <!-- Mobile List -->
                <div id="mobileList" class="md:hidden space-y-4">
                    <!-- Cards injected here -->
                </div>
            </div>
        </div>
    </main>



    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        let jerseys = JSON.parse(localStorage.getItem('jerseys')) || [];

        const jerseyForm = document.getElementById('jerseyForm');
        const jerseyTableBody = document.getElementById('jerseyTableBody');
        const mobileList = document.getElementById('mobileList');
        const totalCountSpan = document.getElementById('totalCount');
        const emptyState = document.getElementById('emptyState');
        const clearAllBtn = document.getElementById('clearAll');
        const downloadPdfBtn = document.getElementById('downloadPdf');

        // Render Functions
        function render() {
            // Update counts
            totalCountSpan.textContent = jerseys.length;
            
            // Toggle empty state
            if (jerseys.length === 0) {
                emptyState.classList.remove('hidden');
                jerseyTableBody.innerHTML = '';
                mobileList.innerHTML = '';
            } else {
                emptyState.classList.add('hidden');
                
                // Desktop Table
                jerseyTableBody.innerHTML = jerseys.map((j, index) => `
                    <tr class="border-b border-slate-800 hover:bg-slate-800/30 transition-colors">
                        <td class="px-6 py-4 font-medium text-slate-300">${j.serialNo}</td>
                        <td class="px-6 py-4">
                            <div class="font-semibold text-white">${j.name}</div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 bg-slate-700 rounded-md text-xs font-bold">${j.size}</span>
                        </td>
                        <td class="px-6 py-4 text-slate-400 text-sm">${j.lane} / ${j.chest}</td>
                        <td class="px-6 py-4 text-slate-400 text-sm">${j.type}</td>
                        <td class="px-6 py-4 text-blue-400 font-bold">#${j.number}</td>
                        <td class="px-6 py-4 text-emerald-400 font-semibold">৳${parseFloat(j.price).toFixed(2)}</td>
                        <td class="px-6 py-4 text-right">
                            <button onclick="deleteJersey(${index})" class="p-2 hover:bg-red-500/10 rounded-lg text-slate-500 hover:text-red-400 transition-all">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                // Mobile Cards
                mobileList.innerHTML = jerseys.map((j, index) => `
                    <div class="glass-card rounded-2xl p-5 border-l-4 border-blue-500">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Serial #${j.serialNo}</span>
                                <h3 class="text-lg font-bold text-white">${j.name}</h3>
                            </div>
                            <button onclick="deleteJersey(${index})" class="p-2 text-slate-500 hover:text-red-400">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-800">
                                <p class="text-slate-500 text-[10px] uppercase">Size & Type</p>
                                <p class="font-semibold">${j.size} / ${j.type}</p>
                            </div>
                            <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-800">
                                <p class="text-slate-500 text-[10px] uppercase">L/C Measurement</p>
                                <p class="font-semibold">L: ${j.lane} / C: ${j.chest}</p>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-emerald-400 font-bold text-lg">৳${parseFloat(j.price).toFixed(2)}</span>
                            <div class="flex items-center space-x-2">
                                <span class="text-blue-400 font-bold">#${j.number}</span>
                                <div class="w-8 h-8 rounded-full bg-blue-600/20 flex items-center justify-center">
                                    <i data-lucide="shirt" class="w-4 h-4 text-blue-400"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            // Refresh icons after dynamic injection
            lucide.createIcons();
            
            // Save to localStorage
            localStorage.setItem('jerseys', JSON.stringify(jerseys));
        }

        // Form Submission
        jerseyForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const newJersey = {
                serialNo: document.getElementById('serialNo').value,
                name: document.getElementById('playerName').value,
                size: document.getElementById('size').value,
                lane: document.getElementById('lane').value,
                chest: document.getElementById('chest').value,
                type: document.getElementById('type').value,
                number: document.getElementById('jerseyNo').value,
                price: document.getElementById('price').value
            };

            jerseys.push(newJersey);
            render();
            jerseyForm.reset();
            
            // Set next serial number automatically
            document.getElementById('serialNo').value = parseInt(newJersey.serialNo) + 1;
            document.getElementById('playerName').focus();
        });

        // Delete function (global for onclick)
        window.deleteJersey = (index) => {
            if(confirm('Remove this jersey from list?')) {
                jerseys.splice(index, 1);
                render();
            }
        };

        // Clear All
        clearAllBtn.addEventListener('click', () => {
            if(confirm('Are you sure you want to clear the entire list?')) {
                jerseys = [];
                render();
            }
        });

        // ─── Excel Export (ExcelJS) ──────────────────────────────────────────
        downloadPdfBtn.addEventListener('click', async () => {
            if (jerseys.length === 0) {
                alert('Add some jerseys to the list first!');
                return;
            }

            const now = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' });
            const headers = ['S/N', 'Player Name', 'Size', 'Length', 'Chest', 'Type', 'Jersey No.', 'Price (Taka)'];

            const wb = new ExcelJS.Workbook();
            wb.creator = 'JerseyPro';
            const ws = wb.addWorksheet('Jersey Orders', {
                pageSetup: { fitToPage: true, orientation: 'portrait' }
            });

            ws.columns = [
                { width: 8 }, { width: 24 }, { width: 8 },
                { width: 12 }, { width: 12 }, { width: 14 },
                { width: 13 }, { width: 18 }
            ];

            // Row 1 – Title (navy background, large white bold)
            ws.mergeCells('A1:H1');
            const titleCell = ws.getCell('A1');
            titleCell.value     = 'JERSEY ORDER LIST';
            titleCell.font      = { name:'Calibri', size:20, bold:true, color:{ argb:'FFFFFFFF' } };
            titleCell.fill      = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF1E3A5F' } };
            titleCell.alignment = { horizontal:'center', vertical:'middle' };
            ws.getRow(1).height = 42;

            // Row 2 – Subtitle
            ws.mergeCells('A2:H2');
            const subCell = ws.getCell('A2');
            subCell.value     = `Exported on ${now}   |   Total Entries: ${jerseys.length}`;
            subCell.font      = { name:'Calibri', size:11, italic:true, color:{ argb:'FFCBD5E1' } };
            subCell.fill      = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF1E3A5F' } };
            subCell.alignment = { horizontal:'center', vertical:'middle' };
            ws.getRow(2).height = 24;

            // Row 3 – Headers (vivid blue)
            const headerRow = ws.addRow(headers);
            headerRow.height = 30;
            headerRow.eachCell(cell => {
                cell.font      = { name:'Calibri', size:12, bold:true, color:{ argb:'FFFFFFFF' } };
                cell.fill      = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF2563EB' } };
                cell.alignment = { horizontal:'center', vertical:'middle', wrapText:true };
                cell.border    = {
                    top:    { style:'medium', color:{ argb:'FF1D4ED8' } },
                    bottom: { style:'medium', color:{ argb:'FF1D4ED8' } },
                    left:   { style:'thin',   color:{ argb:'FF3B82F6' } },
                    right:  { style:'thin',   color:{ argb:'FF3B82F6' } }
                };
            });

            // Data rows (alternating blue shades)
            let total = 0;
            jerseys.forEach((j, idx) => {
                const price     = parseFloat(j.price) || 0;
                total          += price;
                const bg        = idx % 2 === 0 ? 'FFDBEAFE' : 'FFEFF6FF';
                const borderClr = idx % 2 === 0 ? 'FF93C5FD' : 'FFBFDBFE';
                const row       = ws.addRow([
                    j.serialNo, j.name, j.size,
                    j.lane || '-', j.chest || '-',
                    j.type, j.number, price
                ]);
                row.height = 22;
                row.eachCell((cell, col) => {
                    cell.fill      = { type:'pattern', pattern:'solid', fgColor:{ argb:bg } };
                    cell.alignment = { horizontal:'center', vertical:'middle' };
                    cell.border    = {
                        top:    { style:'thin', color:{ argb:borderClr } },
                        bottom: { style:'thin', color:{ argb:borderClr } },
                        left:   { style:'thin', color:{ argb:borderClr } },
                        right:  { style:'thin', color:{ argb:borderClr } }
                    };
                    if (col === 2) {
                        cell.font = { name:'Calibri', size:11, bold:true, color:{ argb:'FF1D4ED8' } };
                    } else if (col === 8) {
                        cell.font   = { name:'Calibri', size:11, bold:true, color:{ argb:'FF059669' } };
                        cell.numFmt = '#,##0.00';
                    } else {
                        cell.font = { name:'Calibri', size:11, color:{ argb:'FF1E293B' } };
                    }
                });
            });

            // Spacer
            ws.addRow([]).height = 8;

            // Total row (emerald green)
            const totalRow = ws.addRow(['','','','','','','TOTAL AMOUNT:', total]);
            totalRow.height = 28;
            totalRow.eachCell((cell, col) => {
                cell.fill   = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF047857' } };
                cell.border = {
                    top:    { style:'medium', color:{ argb:'FF059669' } },
                    bottom: { style:'medium', color:{ argb:'FF059669' } },
                    left:   { style:'thin',   color:{ argb:'FF059669' } },
                    right:  { style:'thin',   color:{ argb:'FF059669' } }
                };
                if (col === 7) {
                    cell.font      = { name:'Calibri', size:12, bold:true, color:{ argb:'FFFFFFFF' } };
                    cell.alignment = { horizontal:'right', vertical:'middle' };
                } else if (col === 8) {
                    cell.font      = { name:'Calibri', size:13, bold:true, color:{ argb:'FFFFFFFF' } };
                    cell.alignment = { horizontal:'center', vertical:'middle' };
                    cell.numFmt    = '#,##0.00';
                }
            });

            // Trigger .xlsx download
            const buffer = await wb.xlsx.writeBuffer();
            const blob   = new Blob([buffer], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
            const url = URL.createObjectURL(blob);
            const a   = document.createElement('a');
            a.href     = url;
            a.download = 'Jersey-Order-List.xlsx';
            a.click();
            URL.revokeObjectURL(url);
        });


        // Initial render
        render();
        // Set initial serial no if empty
        if(jerseys.length === 0) {
            document.getElementById('serialNo').value = 1;
        } else {
            const lastSn = Math.max(...jerseys.map(j => parseInt(j.serialNo) || 0));
            document.getElementById('serialNo').value = lastSn + 1;
        }
    </script>
</body>
</html>
